name: Public documentation integrity

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.html'
      - '**/*.css'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/docs-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests (stdlib)
        run: python3 -m unittest discover -s tests -v
      - name: Validate published documentation
        run: python3 tools/verify_docs.py
